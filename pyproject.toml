[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-release-gate"
version = "0.1.0"
description = "A deterministic release gate for comparing LLM configurations."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "pyyaml>=6", "jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
gate = "release_gate.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/release_gate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
